name: Daily Feed Auto Update & Sync

on:
  schedule:
    # 每天北京时间 17:00 (UTC 09:00) 自动执行
    - cron: '0 9 * * *'
  workflow_dispatch: # 支持在 GitHub 页面随时手动一键触发
    inputs:
      force_refresh:
        description: '强制重新筛选（忽略上期沿用，用于恢复发布文件）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "feed-pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Source Selection
        env:
          QYWX_WEBHOOK_URL: ${{ secrets.QYWX_WEBHOOK_URL }}
          SUBSCRIBE_KEY: ${{ secrets.SUBSCRIBE_KEY }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          node src/cli.js --run-now

      - name: Commit State & Cleanup Git Tracked Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 从 Git 仓库跟踪中移除明文 m3u 文件（确保外人无法通过 git 查看或下载完整列表）
          git rm -f data/current.m3u 2>/dev/null || true
          git rm -rf data/history 2>/dev/null || true
          # 仅跟踪状态元数据与 .gitignore
          git add data/state.json .gitignore
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(data): auto sync feed state [skip ci]"
            # 与手动推送并发时先变基再推，避免 non-fast-forward 导致整个任务失败
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi

      - name: Ensure Playlist Present
        id: playlist
        env:
          SUBSCRIBE_KEY: ${{ secrets.SUBSCRIBE_KEY }}
        run: |
          set -euo pipefail
          KEY="${SUBSCRIBE_KEY:?SUBSCRIBE_KEY 未配置}"
          CLEAN_KEY="${KEY%.m3u}"
          PAGES_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY##*/}"
          # 沿用日不会生成本地文件：先从线上恢复，避免发布空站点把订阅文件冲掉
          if [ ! -s ./data/current.m3u ]; then
            echo "本地无播放列表，尝试从线上恢复..."
            curl -fsSL --max-time 20 --retry 2 \
              "${PAGES_BASE}/${CLEAN_KEY}.m3u?ts=$(date +%s)" \
              -o ./data/current.m3u || true
          fi
          if [ -s ./data/current.m3u ]; then
            echo "has_m3u=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_m3u=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未能获取播放列表，本次跳过 Pages 发布以保留线上版本"
          fi

      - name: Prepare Obfuscated Pages Artifact
        if: steps.playlist.outputs.has_m3u == 'true'
        env:
          SUBSCRIBE_KEY: ${{ secrets.SUBSCRIBE_KEY }}
        run: |
          mkdir -p ./public
          # 必须由仓库 Secret 提供，禁止在代码中保留可预测的兜底后缀
          KEY="${SUBSCRIBE_KEY:?SUBSCRIBE_KEY 未配置，已中止发布以保护订阅地址}"
          # 自动剔除可能误填的 .m3u 后缀，避免重复拼接为 .m3u.m3u
          CLEAN_KEY="${KEY%.m3u}"

          # 同时生成带 .m3u 和不带后缀的文件，确保怎么输入都能正常访问
          cp ./data/current.m3u "./public/${CLEAN_KEY}.m3u"
          cp ./data/current.m3u "./public/${CLEAN_KEY}"
          if [ -f "./data/state.json" ]; then
            cp ./data/state.json "./public/${CLEAN_KEY}_status.json"
          fi

          # 部署根目录 404 伪装页面，隐藏目录列表，阻断直接扫域名
          cat << 'EOF' > ./public/index.html
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>404 Not Found</title></head>
          <body style="font-family:sans-serif;text-align:center;padding:50px;">
            <h2>404 Not Found</h2>
            <p>The requested resource was not found on this server.</p>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages Artifact
        if: steps.playlist.outputs.has_m3u == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: steps.playlist.outputs.has_m3u == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
