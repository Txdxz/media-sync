name: Daily Feed Auto Update & Sync

on:
  schedule:
    # 每天北京时间 17:00 (UTC 09:00) 自动执行
    - cron: '0 9 * * *'
  workflow_dispatch: # 支持在 GitHub 页面随时手动一键触发
    inputs:
      force_refresh:
        description: '强制重新筛选（忽略上期沿用，用于恢复发布文件）'
        required: false
        default: false
        type: boolean
      manual_update:
        description: '手动换源（跳过沿用并排除当前源，按优先级换下一个）'
        required: false
        default: false
        type: boolean
      region:
        description: '限定地区（如 山西 / 广东），留空则按全局优先级'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "feed-pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Source Selection
        env:
          QYWX_WEBHOOK_URL: ${{ secrets.QYWX_WEBHOOK_URL }}
          SUBSCRIBE_KEY: ${{ secrets.SUBSCRIBE_KEY }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          MANUAL_UPDATE: ${{ inputs.manual_update }}
          REGION: ${{ inputs.region }}
        run: |
          node src/cli.js --run-now

      - name: Commit State & Cleanup Git Tracked Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 从 Git 仓库跟踪中移除明文 m3u 文件（确保外人无法通过 git 查看或下载完整列表）
          git rm -f data/current.m3u 2>/dev/null || true
          git rm -rf data/history 2>/dev/null || true
          # 仅跟踪状态元数据与 .gitignore
          git add data/state.json .gitignore
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(data): auto sync feed state [skip ci]"
            # 与手动推送并发时先变基再推，避免 non-fast-forward 导致整个任务失败
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi

      - name: Collect Self Sources
        if: always()
        run: |
          # 采集自建源（情报聚合），失败不影响原站源发布
          node scan/intel-collect.js || echo "::warning::情报采集失败，跳过自建源"
          node scan/intel-to-db.js || echo "::warning::自建源库构建失败"

      - name: Ensure Playlist Present
        id: playlist
        env:
          SUBSCRIBE_KEY: ${{ secrets.SUBSCRIBE_KEY }}
        run: |
          set -euo pipefail
          KEY="${SUBSCRIBE_KEY:?SUBSCRIBE_KEY 未配置}"
          CLEAN_KEY="${KEY%.m3u}"
          PAGES_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY##*/}"
          # 主文件（原站源）只由本次选源生成；沿用日不生成则跳过主文件发布（保留线上旧版），
          # 绝不再从线上恢复——避免把自建源误当原站源发布。
          # 安全校验：若本地主文件含自建源特征（境外其他/未分组且无组播/酒店），剔除它
          if [ -s ./data/current.m3u ] && grep -q '境外其他\|未分组' ./data/current.m3u && ! grep -q '组播\|酒店' ./data/current.m3u; then
            echo "::warning::主文件疑似自建源，不作为原站源发布"
            rm -f ./data/current.m3u
          fi
          if [ -s ./data/current.m3u ]; then
            echo "has_m3u=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_m3u=false" >> "$GITHUB_OUTPUT"
          fi
          # 自建源兜底：即使原站源不可用，只要有自建源库也应发布
          if [ -f ./data/source_db.json ]; then
            echo "has_self=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_self=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$( [ -s ./data/current.m3u ] && echo y || echo n )" = "n" ] && [ ! -f ./data/source_db.json ]; then
            echo "::warning::既无原站源也无自建源，本次跳过 Pages 发布以保留线上版本"
          fi

      - name: Prepare Obfuscated Pages Artifact
        if: steps.playlist.outputs.has_m3u == 'true' || steps.playlist.outputs.has_self == 'true'
        env:
          SUBSCRIBE_KEY: ${{ secrets.SUBSCRIBE_KEY }}
        run: |
          mkdir -p ./public
          # 必须由仓库 Secret 提供，禁止在代码中保留可预测的兜底后缀
          KEY="${SUBSCRIBE_KEY:?SUBSCRIBE_KEY 未配置，已中止发布以保护订阅地址}"
          # 自动剔除可能误填的 .m3u 后缀，避免重复拼接为 .m3u.m3u
          CLEAN_KEY="${KEY%.m3u}"

          # 同时生成带 .m3u 和不带后缀的文件，确保怎么输入都能正常访问
          cp ./data/current.m3u "./public/${CLEAN_KEY}.m3u"
          cp ./data/current.m3u "./public/${CLEAN_KEY}"
          if [ -f "./data/state.json" ]; then
            cp ./data/state.json "./public/${CLEAN_KEY}_status.json"
          fi

          # 自建源（B 线）：由情报采集的 source_db 生成，独立文件名，不依赖原站
          # 若本地无 source_db（如首次），跳过但不影响 A 线发布
          if [ -f "./data/source_db.json" ]; then
            node scan/build-publish.js || echo "::warning::自建源生成失败，仅发布原站源"
            if [ -f "./public/${CLEAN_KEY}_self.m3u" ]; then
              echo "已生成自建源订阅: ${CLEAN_KEY}_self.m3u"
            fi
          fi

          # 部署根目录 404 伪装页面，隐藏目录列表，阻断直接扫域名
          cat << 'EOF' > ./public/index.html
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>404 Not Found</title></head>
          <body style="font-family:sans-serif;text-align:center;padding:50px;">
            <h2>404 Not Found</h2>
            <p>The requested resource was not found on this server.</p>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages Artifact
        if: steps.playlist.outputs.has_m3u == 'true' || steps.playlist.outputs.has_self == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: steps.playlist.outputs.has_m3u == 'true' || steps.playlist.outputs.has_self == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
